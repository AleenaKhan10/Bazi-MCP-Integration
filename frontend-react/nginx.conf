# ================================================
# Nginx Configuration for BaZi Frontend
# ================================================
# 1. Serves React static files at /
# 2. Proxies /api/* requests to the backend container
# 3. Proxies /reports/* to backend (for HTML/PDF viewing)
# 4. Handles SPA routing (fallback to index.html)

server {
    listen 80;
    server_name _;

    # Where the React build lives
    root /usr/share/nginx/html;
    index index.html;

    # ---- API Proxy ----
    # Forward /api/* calls to the FastAPI backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for report generation (Claude takes time)
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # ---- Reports Proxy ----
    # Forward /reports/* to backend (serves HTML/PDF files)
    location /reports/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Swagger Docs Proxy ----
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ---- SPA Fallback ----
    # Any route that doesn't match a real file → serve index.html
    # (React Router handles the rest)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Caching for static assets ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
